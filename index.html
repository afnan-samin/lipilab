        @font-face {

            font-display: swap;
        }
        
        :root {
            --bg-color: #f0f2f5;
            --container-bg: white;
            --text-color: #333;
            --border-color: #ccc;
            --btn-green: #28a745;
            --btn-green-h: #218838;
            --btn-red: #dc3545;
            --btn-red-h: #c82333;
            --btn-blue: #007bff;
            --btn-blue-h: #0056b3;
            --btn-clear: #ffc107;
            --btn-clear-h: #e0a800;
            --footer-bg: #d6d6d6;
        }
        
        body.dark-mode {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #444;
            --footer-bg: #333;
            --footer-text: #fff;
        }
        
        body {
            font-family: 'Times New Roman', serif;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            transition: background-color 0.3s, color 0.3s;
        }
        
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    max-width: 1000px;
    margin: 0 auto 20px;
}        
.header {
    flex: 1;
    text-align: center;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0;
    font-size: 42px;
    font-weight: 800;
    color: var(--text-color);
    letter-spacing: 2px;
}

.header p {
    margin: 6px 0 0;
    font-size: 18px;
    color: var(--text-color);
    opacity: .75;
    font-weight: 500;
}
        .toggle-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-size: 18px;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 4px;
        }
        
        .shortcuts-info {
            max-width: 1000px;
            margin: 0 auto 20px auto;
            background: var(--container-bg);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
            font-size: 14px;
            border: 1px solid var(--border-color);
        }
        
        .shortcuts-info h4 {
            margin: 0 0 10px 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }
        
        .shortcuts-info div {
            margin: 5px 0;
            display: flex;
            align-items: center;
        }
        
        kbd {
            background: #eee;
            border: 1px solid #ccc;
            border-radius: 3px;
            padding: 2px 5px;
            font-family: monospace;
            font-size: 12px;
            margin: 0 2px;
        }
        
        body.dark-mode kbd {
            background: #333;
            border: 1px solid #555;
            color: #fff;
        }
        
.container {
    display: flex;
    gap: 20px;
    align-items: stretch;
    max-width: 1000px;
    margin: auto;
    background: var(--container-bg);
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
}        
.box {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 12px;
}        
        h3 {
            margin: 0 0 10px 0;
            color: var(--text-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
textarea {

    width:100%;
    max-width:100%;

    height:220px;

    padding:12px;

    font-size:16px;

    border:1px solid var(--border-color);

    border-radius:8px;

    box-sizing:border-box;

    resize:vertical;

    line-height:1.6;

    font-family:'Times New Roman',serif;

    background:var(--container-bg);

    color:var(--text-color);

    transition:.25s;

}

textarea:focus{

outline:none;

border-color:#4a90e2;

box-shadow:0 0 0 3px rgba(74,144,226,.15);

}        
        .output-area {
            font-family: 'SutonnyMJ', 'Times New Roman', serif;
            font-size: 20px;
            background-color: var(--bg-color);
        }
        
        .controls {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 15px;
            min-width: 120px;
        }
        
button{

background:var(--btn-green);

color:white;

border:none;

padding:12px 18px;

font-size:15px;

cursor:pointer;

border-radius:8px;

font-family:'Times New Roman',serif;

font-weight:bold;

transition:all .25s ease;

}

button:hover{

transform:translateY(-2px);

background:var(--btn-green-h);

}

button:active{

transform:scale(.98);

}        
        button:hover {
            background: var(--btn-green-h);
	    transform:translateY(-2px);
        }
        
        .download-btn {
            background: var(--btn-red);
        }
        
        .download-btn:hover {
            background: var(--btn-red-h);
        }
        
        .copy-btn {
            background: var(--btn-blue);
        }
        
        .copy-btn:hover {
            background: var(--btn-blue-h);
        }
        
        .clear-btn {
            background: var(--btn-clear);
            color: #000;
        }
        
        .clear-btn:hover {
            background: var(--btn-clear-h);
        }
        
        .upload-btn {
            background: #6c757d;
        }
        
        .upload-btn:hover {
            background: #5a6268;
        }
        
        .mode-select {
            padding: 10px;
            font-size: 15px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--container-bg);
            color: var(--text-color);
            font-family: 'Times New Roman', serif;
            font-weight: bold;
        }
        
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
        }
        
        .stats {
            font-size: 13px;
            color: #666;
            text-align: right;
        }
        
        body.dark-mode .stats {
            color: #aaa;
        }
        
        .footer {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background-color: var(--footer-bg);
            color: var(--footer-text, #000);
            font-weight: bold;
            font-family: 'Times New Roman', serif;
            border-radius: 4px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            font-size: 18px;
        }
        .footer a {
            color: inherit;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .footer a:hover {
            color: #1877F2; /* Facebook Blue */
            text-decoration: underline;
        }
        
        .footer i {
            margin-right: 6px;
            font-size: 18px;
        }
        
        input[type="file"] {
            display: none;
        }

.header p{

font-size:15px;

.controls{

.shortcuts-info div{

.footer{

}

textarea{

height:180px;

}

}

function cleanUpText(text) {
    return text.replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();

function handleConvert() {
    let text = document.getElementById('inputText').value;
    if (document.getElementById('cleanText').checked) {
        text = cleanUpText(text);
        document.getElementById('inputText').value = text;
    }
    
    const mode = document.getElementById('conversionMode').value;
    parsedData = [];
    
    if (mode === 'uni2bijoy') {
        const regex = /([^\sa-zA-Z0-9\u0980-\u09FF\u0964\u0965]*[\u0980-\u09FF\u0964\u0965]+[^\sa-zA-Z0-9\u0980-\u09FF\u0964\u0965]*)|([^\sa-zA-Z0-9\u0980-\u09FF\u0964\u0965]*[a-zA-Z0-9]+[^\sa-zA-Z0-9\u0980-\u09FF\u0964\u0965]*)|(\s+)|([^\sa-zA-Z0-9\u0980-\u09FF\u0964\u0965]+)/g;
        let match;
        let lastFont = 'Times New Roman';
        
        while ((match = regex.exec(text)) !== null) {
            let token = { text: '', font: 'Times New Roman' };
            if (match[1]) {
                token.text = ConvertToASCII(match[1]);
                token.font = 'SutonnyMJ';
            } else if (match[2]) {
                token.text = match[2];
                token.font = 'Times New Roman';
            } else if (match[3]) {

        e.preventDefault();
